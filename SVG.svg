<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Large green sphere -->
  <defs>
    <radialGradient id="greenSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a8ffb0"/>
      <stop offset="40%" stop-color="#35c94b"/>
      <stop offset="100%" stop-color="#0b6b1c"/>
    </radialGradient>

    <radialGradient id="redSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd0d0"/>
      <stop offset="40%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
  </defs>

  <!-- Outer green sphere -->
  <circle cx="150" cy="150" r="120" fill="url(#greenSphere)" />

  <!-- Inner red sphere -->
  <circle cx="150" cy="150" r="50" fill="url(#redSphere)" />