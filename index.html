<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maximum Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0f0f0f;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 15px;
        background: #1a1a1a;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 2px solid #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #status {
        font-size: 14px;
        color: #888;
    }

    #log {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        white-space: pre-wrap;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .msg {
        padding: 10px 14px;
        background: #1e1e1e;
        border-radius: 8px;
        animation: fadeIn 0.2s ease-out;
        max-width: 80%;
        word-wrap: break-word;
    }

    .server {
        background: #2a2a2a;
        border-left: 4px solid #4caf50;
    }

    .self {
        background: #2a2a2a;
        border-left: 4px solid #2196f3;
        align-self: flex-end;
    }

    .system {
        background: #2a2a2a;
        border-left: 4px solid #b347ff;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    footer {
        padding: 10px;
        background: #1a1a1a;
        display: flex;
        gap: 10px;
        border-top: 2px solid #333;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: none;
        outline: none;
        background: #2a2a2a;
        color: white;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        background: #4caf50;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }
</style>
</head>
<body>

<header>
    Maximum Chat
    <span id="status">Connecting...</span>
</header>

<div id="log"></div>

<footer>
    <input id="msg" placeholder="Type a message">
    <button onclick="send()">Send</button>
</footer>

<script>


const PASSWORD = "SuperSecretPassword123"; // same as server
const SALT = "fixed-salt";                 // same as server

function strToBuf(str) {
    return new TextEncoder().encode(str);
}

function bufToStr(buf) {
    return new TextDecoder().decode(buf);
}

// Derive AES key from password using PBKDF2
async function getKey() {
    const baseKey = await crypto.subtle.importKey(
        "raw",
        strToBuf(PASSWORD),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: strToBuf(SALT),
            iterations: 100000,
            hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

async function encryptMessage(text) {
    const key = await getKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));

    const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        strToBuf(text)
    );

    const combined = new Uint8Array(iv.byteLength + ciphertext.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(ciphertext), iv.byteLength);

    return btoa(String.fromCharCode(...combined));
}

async function decryptMessage(base64) {
    const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const iv = data.slice(0, 12);
    const ciphertext = data.slice(12);

    const key = await getKey();

    const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        ciphertext
    );

    return bufToStr(plaintext);
}

// ===============================
//  WebSocket Client
// ===============================

let socket;

function logMessage(text, type = "system") {
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

async function start() {
    socket = new WebSocket("ws://localhost:5000"); // adjust host if needed

    socket.onopen = () => {
        document.getElementById("status").textContent = "Connected";
        logMessage("Connected to server", "system");
    };

    socket.onmessage = async (event) => {
        try {
            const decrypted = await decryptMessage(event.data);
            logMessage(decrypted, "server");
        } catch (e) {
            logMessage("Failed to decrypt message", "system");
        }
    };

    socket.onclose = () => {
        document.getElementById("status").textContent = "Disconnected";
        logMessage("Disconnected from server", "system");
    };
}

start();

// ===============================
//  Sending Messages
// ===============================

async function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
    if (!text || socket.readyState !== WebSocket.OPEN) return;

    const encrypted = await encryptMessage(text);
    socket.send(encrypted);

    logMessage(text, "self");
    input.value = "";
}
</script>

</body>
</html>
