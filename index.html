<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maximum Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
    }

    header {
        padding: 15px;
        background: #1a1a1a;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 2px solid #333;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header .left {
        text-align: left;
        flex: 1;
    }

    header .center {
        text-align: center;
        flex: 1;
    }

    header .right {
        text-align: right;
        flex: 1;
        font-size: 14px;
        color: #888;
    }

    #log {
        height: calc(100vh - 160px);
        overflow-y: auto;
        padding: 20px;
    }

    .msg {
        margin-bottom: 15px;
        padding: 10px 15px;
        border-radius: 10px;
        max-width: 70%;
        line-height: 1.4;
    }

    .self {
        background: #4a4a4a;
        margin-left: auto;
    }

    .server {
        background: #2a2a2a;
        border-left: 4px solid #9b59b6;
    }

    footer {
        display: flex;
        padding: 15px;
        background: #1a1a1a;
        border-top: 2px solid #333;
    }

    #msg {
        flex: 1;
        padding: 10px;
        border-radius: 5px;
        border: none;
        outline: none;
        background: #2a2a2a;
        color: white;
        font-size: 16px;
    }

    #button {
        margin-left: 10px;
        padding: 10px 20px;
        background: #9b59b6;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #button:hover {
        background: #b07ad1;
    }
</style>

</head>
<body>

<header>
    <div class="left">Maximum Chat</div>
    <div class="center">etee</div>
    <div class="right" id="status">Connecting...</div>
</header>

<div id="log"></div>

<footer>
    <input id="msg" placeholder="Type a message">
    <button onclick="send()" id="button">Send</button>
</footer>

<script>
const PASSWORD = "SuperSecretPassword123";
const SALT = "fixed-salt";

let myId = crypto.randomUUID();
let socket;
let heartbeat;

function strToBuf(str) { return new TextEncoder().encode(str); }
function bufToStr(buf) { return new TextDecoder().decode(buf); }

async function getKey() {
    const baseKey = await crypto.subtle.importKey(
        "raw", strToBuf(PASSWORD), "PBKDF2", false, ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: strToBuf(SALT),
            iterations: 100000,
            hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

async function encryptMessage(text) {
    const key = await getKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));

    const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        strToBuf(text)
    );

    const combined = new Uint8Array(iv.byteLength + ciphertext.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(ciphertext), iv.byteLength);

    return btoa(String.fromCharCode(...combined));
}

async function decryptMessage(base64) {
    const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const iv = data.slice(0, 12);
    const ciphertext = data.slice(12);

    const key = await getKey();

    const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        ciphertext
    );

    return bufToStr(plaintext);
}

function logMessage(text, type = "system") {
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function start() {
    socket = new WebSocket("wss://chat-server-r42a.onrender.com");

    socket.onopen = () => {
        document.getElementById("status").textContent = "🟢 Connected";
        logMessage("Connected to server", "system");

        heartbeat = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) socket.send("ping");
        }, 30000);
    };

    socket.onmessage = async (event) => {
        if (event.data === "pong") return;

        try {
            const decrypted = await decryptMessage(event.data);
            const data = JSON.parse(decrypted);

            if (data.id === myId) return;

            logMessage(data.text, "server");
        } catch {
            logMessage("Failed to decrypt message", "system");
        }
    };

    socket.onclose = () => {
        clearInterval(heartbeat);
        document.getElementById("status").textContent = "🔴 Disconnected";
        logMessage("Disconnected — retrying in 3s", "system");
        setTimeout(start, 3000);
    };
}

start();

async function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
    if (!text || socket.readyState !== WebSocket.OPEN) return;

    const payload = JSON.stringify({ id: myId, text });
    const encrypted = await encryptMessage(payload);

    socket.send(encrypted);

    logMessage(text, "self");
    input.value = "";
}

window.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
