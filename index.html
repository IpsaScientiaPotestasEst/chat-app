<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Maximum Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="AnSVG.svg">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px;
            background: #1a1a1a;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .left {
            flex: 1;
            text-align: left;
        }

        header .center {
            flex: 1;
            text-align: center;
            font-size: 14px;
            color: #888;
        }

        header .right {
            flex: 1;
            text-align: right;
        }

        #status {
            font-size: 14px;
            color: #888;
        }

        #log {
            position: absolute;
            top: 60px;
            bottom: 60px;
            left: 15px;
            right: 0;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 10px 14px;
            background: #1e1e1e;
            border-radius: 8px;
            animation: fadeIn 0.2s ease-out;
            max-width: 80%;
            word-wrap: break-word;
        }

        .server {
            background: #2a2a2a;
            border-left: 4px solid #4caf50;
        }

        .self {
            background: #2a2a2a;
            border-left: 4px solid #2196f3;
            align-self: flex-end;
        }

        .system {
            background: #2a2a2a;
            border-left: 4px solid #b347ff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            padding: 10px;
            background: #1a1a1a;
            display: flex;
            gap: 10px;
            border-top: 2px solid #333;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #2a2a2a;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: #4caf50;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }


        #login {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(77, 75, 75, 0.932);
            z-index: 999999;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        #login-header {
            font-size: 42px;
            font-weight: 700;
            color: #111;
            letter-spacing: 1px;
        }

        #login-input {
            width: 90%;
            max-width: 400px;
            padding: 12px;
            font-size: 20px;
            border-radius: 8px;
            border: 2px solid #222;
            background-color: #000;
            color: white;
            transition: 0.2s ease;
        }

        #login-input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }




        header {
            padding: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            margin-bottom: 0;
        }

        header .left,
        header .center,
        header .right {
            flex: 1;
        }

        header .left {
            text-align: left;
        }

        header .center {
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header .right {
            text-align: right;
        }




        #sideBar {
            position: fixed;
            top: 60px;
            bottom: 65px;
            left: 0;
            width: 20%;
            background-color: #333;
            z-index: 9999;
            overflow-y: auto;
            padding: 10px;
            transition: 0.5s ease;
        }

        #sideButton {
            width: 5px;
            position: fixed;
            bottom: 50%;
            left: 24%;
            z-index: 100000;
            color: rgb(255, 140, 0);
            font-size: 25px;
            padding: 3px 3px;
            border-radius: 4px;
            cursor: pointer;
        }

        #wrapSide {
            background-color: #333;
            height: 100%;
            width: 28%;
            left: 0;
            z-index: 9999;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
            border-top: 1px solid white;
            transition: 0.5s ease;
        }

        #wrapSide>#volume {
            width: 70%;
        }

        #volume {
            background-color: #000000d2;
        }

        #check {
            color: lime;
            float: right;
        }

        @media (max-width: 600px) {


            html,body{
                overflow: scroll;
            }

            header {
                padding: 6px 10px;
                font-size: 14px;
                height: 48px;
                line-height: 48px;
            }


            #log {
                position: fixed;
                top: 65px;
                bottom: 92px;
                left: 0;
                right: 0;
                padding: 10px;
                overflow-y: auto;
            }


            footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px;
                flex-direction: column;
                gap: 6px;
                height: 92px;
                background: #1a1a1a;
                border-top: 2px solid #333;
            }

            footer input,
            footer button {
                width: 100%;
                font-size: 14px;
            }


            #wrapSide {
                position: fixed;
                top: 46px;
                bottom: 200px;
                width: 40%;
                left: 0;
                overflow: hidden;
                border: none;
            }


            #sideBar {
                position: fixed;
                top: 48px;
                bottom: 92px;
                width: 75%;
                padding: 10px;
                overflow-y: auto;
            }


            #sideButton {
                position: fixed;
                left: 0;
                bottom: 45%;
                font-size: 22px;
                padding: 6px 8px;
                z-index: 100000;
            }


            #volume {
                width: 100%;
                font-size: 14px;
            }


            #login-header {
                font-size: 28px;
            }

            #login-input {
                width: 60%;
                font-size: 18px;
            }
        }
    </style>

</head>

<body>

    <header>
        <div class="left">Maximum Chat</div>
        <div class="center">End-to-end Encrypted</div>
        <div class="right" id="status">Connecting...</div>
    </header>



    <div id="log"></div>

    <div id="login">
        <h2 id="login-header">Login</h2>

        <br>

        <input id="login-input" type="input" placeholder="Enter a username:">
    </div>

    <div id="wrapSide">

        <div id="sideBar">
            <input type="text" placeholder="Volume (0.1 to 1):" id="volume">
            <div id="check"></div>

        </div>

        <p id="sideButton">
            << /p>

    </div>



    <footer>
        <input id="msg" placeholder="Type a message">
        <button onclick="send()" id="button">Send</button>
        <button onclick="resetUsername()" id="click">Username</button>
        <a href="Log Info.html" target="_blank">Log Info</a>
    </footer>

    <script>

        let theVol = 0.5;

        const volume = document.getElementById("volume");

        const check = document.getElementById("check");

        function doVolume() {

            v = parseFloat(volume.value);

            let vol = volume.value;

            if (!isNaN(v) && v >= 0 && v <= 1 && !vol == "") {
                theVol = v; check.textContent = "✔";
            }

            else {
                theVol = 0.5; check.textContent = "❌";
            }


        }

        volume.addEventListener("keyup", function (e) {

            let volume = document.getElementById("check");

            if (e.key === "Enter") {
                doVolume();
            }
        })

        function openSide() {
            const btn = document.getElementById("sideButton");
            const sideBar = document.getElementById("sideBar");
            const warp = document.getElementById("wrapSide");
            const check = document.getElementById("check");
            const volume = document.getElementById("volume");

            sideBar.style.width = "0.5%";
            sideBar.style.display = "none";
            warp.style.width = "0%";
            btn.style.left = "0";
            warp.style.borderRight = "none";
            btn.textContent = ">";
            localStorage.setItem("in", true);

            btn.addEventListener("click", function () {
                if (!localStorage.getItem("in")) {
                    sideBar.style.width = "0.5%";
                    localStorage.setItem("in", true);
                    btn.textContent = ">";
                    sideBar.style.display = "none"
                    warp.style.width = "0%";
                    btn.style.left = "0"
                    warp.style.borderRight = "none";
                    btn.style.transition = "0.5s ease"
                    check.textContent = "";
                    volume.textContent = "";

                } else {
                    sideBar.style.width = "20%";
                    localStorage.removeItem("in");
                    btn.textContent = "<";
                    sideBar.style.display = "block";
                    warp.style.width = "28%";
                    btn.style.left = "24%";
                    warp.style.borderRight = "1px solid white";
                    btn.style.transition = "1s ease"
                }
            });

        }


        openSide();



        function enableNotifications() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
        }



        function Notify(msg, other, duration = 5000) {

            if (document.visibilityState === "hidden" && Notification.permission === "granted") {



                let note = new Notification(msg, {
                    body: other,
                    tag: "ui-update",
                    silent: true
                });

                setTimeout(() => {
                    note.close();
                }, duration);
            }
        }


        document.addEventListener("click", enableNotifications, { once: true });


        let login = document.getElementById("login");
        let loginInput = document.getElementById("login-input");

        function resetUsername() {
            localStorage.removeItem("login-done");
            login.style.display = "block";
            loginInput.focus();
            window.location.reload();
        }

        function showError() {
            let existing = document.getElementById("login-error");
            if (existing) return;

            let div = document.createElement("div");
            div.id = "login-error";
            div.textContent = "Please enter a valid input";

            div.style.margin = "20px auto";
            div.style.textAlign = "center";
            div.style.color = "black";
            div.style.backgroundColor = "red";
            div.style.borderRadius = "10px";
            div.style.width = "50%";
            div.style.height = "50px";
            div.style.border = "5px solid black";
            div.style.padding = "5px";
            div.style.fontSize = "35px";
            div.style.fontWeight = "bold";

            login.appendChild(div);
        }

        let inputValue = document.getElementById("login-input").value;

        window.onload = loginInput.focus();

        function doUsername() {

            function tryLogin() {
                let inputValue = loginInput.value.trim();

                if (inputValue !== "") {
                    localStorage.setItem("username", inputValue);
                    localStorage.setItem("login-done", "true");

                    loginInput.value = "";
                    login.style.display = "none";
                } else {
                    showError();
                }
            }


            loginInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") tryLogin();
            });


            loginInput.addEventListener("keyup", function (e) {
                if (e.key === "Enter") tryLogin();
            });


            loginInput.addEventListener("change", tryLogin);
        }

        if (!localStorage.getItem("login-done")) {
            login.style.display = "block";
            doUsername();
        }

        else {
            login.style.display = "none";
        }



        const PASSWORD = "SuperSecretPassword123";
        const SALT = "fixed-salt";

        let myId = crypto.randomUUID();
        let socket;
        let heartbeat;

        function strToBuf(str) { return new TextEncoder().encode(str); }
        function bufToStr(buf) { return new TextDecoder().decode(buf); }

        async function getKey() {
            const baseKey = await crypto.subtle.importKey(
                "raw", strToBuf(PASSWORD), "PBKDF2", false, ["deriveKey"]
            );

            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: strToBuf(SALT),
                    iterations: 100000,
                    hash: "SHA-256"
                },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptMessage(text) {
            const key = await getKey();
            const iv = crypto.getRandomValues(new Uint8Array(12));

            const ciphertext = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv },
                key,
                strToBuf(text)
            );

            const combined = new Uint8Array(iv.byteLength + ciphertext.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ciphertext), iv.byteLength);

            return btoa(String.fromCharCode(...combined));
        }

        async function decryptMessage(base64) {
            const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            const iv = data.slice(0, 12);
            const ciphertext = data.slice(12);

            const key = await getKey();

            const plaintext = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv },
                key,
                ciphertext
            );

            return bufToStr(plaintext);
        }

        function logMessage(text, type = "system") {
            const log = document.getElementById("log");
            const div = document.createElement("div");
            div.className = "msg " + type;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function start() {
            socket = new WebSocket("wss://chat-server-r42a.onrender.com");

            socket.onopen = () => {
                document.getElementById("status").textContent = "🟢 Connected";
                logMessage("Connected to server", "system");

                heartbeat = setInterval(() => {
                    if (socket.readyState === WebSocket.OPEN) socket.send("ping");
                }, 30000);
            };

            socket.onmessage = async (event) => {
                if (event.data === "pong") return;

                try {
                    const decrypted = await decryptMessage(event.data);
                    const data = JSON.parse(decrypted);

                    if (data.id === myId) return;

                    logMessage(data.text, "server");

                    if (document.hidden) {

                        let ding = new Audio("ding.mp3");
                        ding.volume = theVol;

                        Notify("Someone sent a message", data.text, 3000);

                        ding.play();


                    }
                } catch {
                    logMessage("Failed to decrypt message", "system");
                }



                socket.onclose = () => {
                    clearInterval(heartbeat);
                    document.getElementById("status").textContent = "🔴 Disconnected";
                    logMessage("Disconnected — retrying in 3s", "system");
                    setTimeout(start, 3000);
                };
            }
        }

        start();

        async function send() {
            const input = document.getElementById("msg");
            const text = input.value.trim();
            if (!text || socket.readyState !== WebSocket.OPEN) return;


            let username = localStorage.getItem("username");


            let finalText = username ? `${username}: ${text}` : text;


            const payload = JSON.stringify({ id: myId, text: finalText });
            const encrypted = await encryptMessage(payload);
            socket.send(encrypted);


            logMessage(finalText, "self");

            input.value = "";
        }

        window.addEventListener("keydown", e => {
            if (e.key === "Enter") send();
        });


    </script>

</body>

</html>
