<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maximum Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0f0f0f;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 15px;
        background: #1a1a1a;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 2px solid #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #status {
        font-size: 14px;
        color: #888;
    }

    #log {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        white-space: pre-wrap;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .msg {
        padding: 10px 14px;
        background: #1e1e1e;
        border-radius: 8px;
        animation: fadeIn 0.2s ease-out;
        max-width: 80%;
        word-wrap: break-word;
    }

    .server {
        background: #2a2a2a;
        border-left: 4px solid #4caf50;
    }

    .self {
        background: #2a2a2a;
        border-left: 4px solid #2196f3;
        align-self: flex-end;
    }

    .system {
        background: #2a2a2a;
        border-left: 4px solid #b347ff;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    footer {
        padding: 10px;
        background: #1a1a1a;
        display: flex;
        gap: 10px;
        border-top: 2px solid #333;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: none;
        outline: none;
        background: #2a2a2a;
        color: white;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        background: #4caf50;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }
</style>
</head>
<body>

<header>
    Maximum Chat
    <span id="status">Connecting...</span>
</header>

<div id="log"></div>

<footer>
    <input id="msg" placeholder="Type a message">
    <button onclick="send()">Send</button>
</footer>

<script>
let ws = new WebSocket("wss://chat-server-r42a.onrender.com");


let myID = Math.random().toString(36).substring(2, 10);

ws.onopen = () => {
    setStatus("🟢 Connected");
    log("Connected to server!", "system");
};

ws.onclose = () => {
    setStatus("🔴 Disconnected");
};

ws.onerror = () => {
    setStatus("⚠️ Error (check console)");
};

ws.onmessage = (msg) => {
    let data = JSON.parse(msg.data);

    
    if (data.id === myID) return;

    log(data.text, "server");
};

function send() {
    let text = document.getElementById("msg").value.trim();
    if (!text) return;

    
    ws.send(JSON.stringify({ id: myID, text: text }));

    
    log(text, "self");

    document.getElementById("msg").value = "";
}

function log(message, type) {
    let logBox = document.getElementById("log");

    let div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = message;

    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(text) {
    document.getElementById("status").textContent = text;
}

document.getElementById("msg").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
